name: Bug report
description: Something on the site is broken or looks wrong
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page or feature
      placeholder: e.g. /events on phone, contact form, dark theme
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Phone, Tablet, Laptop / desktop]
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if you have them.
