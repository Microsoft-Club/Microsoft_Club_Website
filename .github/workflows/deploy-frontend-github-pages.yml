name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install + Build
        env:
          # Keep production builds usable even when the optional secret is
          # missing; local development still uses frontend/.env.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://microsoft-club-website.onrender.com' }}
          # Changed from /Microsoft_Club_Website/ to / for custom domain
          VITE_BASE_URL: /
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Create CNAME
        # This ensures GitHub Pages knows to use your custom domain
        run: echo "mlsaclubgiki.tech" > frontend/dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
