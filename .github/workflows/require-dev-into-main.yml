name: Require dev into main

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      - main

jobs:
  dev-to-main:
    name: dev-to-main
    runs-on: ubuntu-latest
    steps:
      - name: Only allow the dev branch to merge into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "This check only gates pull requests into main."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Pull requests into main must come from the dev branch of ${BASE_REPO}. Got ${HEAD_REPO}:${HEAD_REF}."
            exit 1
          fi
          echo "Pull request source is ${BASE_REPO}:dev."
